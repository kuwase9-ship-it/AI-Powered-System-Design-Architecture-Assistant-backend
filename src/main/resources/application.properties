spring.application.name=archpilot

# Which environment's config (application-dev/production.properties) to load.
# Override with the SPRING_PROFILES_ACTIVE env var — Railway must set this to "production".
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database connectivity credentials
spring.datasource.url=jdbc:postgresql://localhost:5432/archpilot
spring.datasource.username=postgres
spring.datasource.password=ateyimbabazi27/04

# Spring JPA configurations
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# OAuth authentication credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# redirect-uri is identical across profiles: {baseUrl} resolves from the incoming
# request itself (localhost locally, the Railway host in production)
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{regitrationId}

# JWT secret credentials
jwt.secret=${JWT_SECRET}

# Brevo email service
BREVO_API=${BREVO_API_KEY}
BREVO_MAIL=${BREVO_SENDER_EMAIL}
BREVO_SENDER_NAME=${BREVO_SENDER_NAME}

# Server configuration
server.port=${PORT:8080}

# Swagger/OpenAPI  serve docs under /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

